<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Văn Bản Chỉ Đạo</title>
    <!-- Google Fonts Mulish -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Mulish", sans-serif;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        background-color: #0f172a;
        overflow: hidden;
      }
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50px;
        background-color: #1e293b;
        display: flex;
        align-items: center;
        padding: 0 15px;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      }
      .btn-back {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn-back:hover {
        background-color: #1d4ed8;
      }
      .viewer-container {
        width: 100%;
        height: calc(100% - 50px);
        margin-top: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 20px;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .doc-image {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <button class="btn-back" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Quay lại
      </button>
    </div>

    <div id="viewer-container" class="viewer-container">
      <!-- Nội dung PDF hoặc Ảnh sẽ tự động chèn vào đây -->
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const fileUrl = urlParams.get("file");
      const container = document.getElementById("viewer-container");

      if (fileUrl) {
        const decodedUrl = decodeURIComponent(fileUrl);
        const ext = decodedUrl.split(".").pop().toLowerCase();

        // Nếu tệp là PDF -> dùng iframe, nếu là Ảnh -> dùng thẻ img
        if (ext === "pdf") {
          container.innerHTML = `<iframe src="${decodedUrl}" type="application/pdf"></iframe>`;
        } else {
          container.innerHTML = `<img src="${decodedUrl}" alt="Văn bản chỉ đạo" class="doc-image">`;
        }
      } else {
        container.innerHTML =
          '<p style="color: white;">Không tìm thấy tệp văn bản!</p>';
      }

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      }
    </script>
  </body>
</html>
