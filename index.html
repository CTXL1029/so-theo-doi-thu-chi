<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Khai báo các thẻ Meta ngăn chặn trình duyệt cache file HTML -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/jpeg" href="assets/favicon.png" />
    <title>Sổ Thu Chi Lớp Học</title>
    <!-- Chèn vào trong thẻ <head> của index.html và pdf-viewer.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <!-- FontAwesome icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="main-header">
      <!-- 1. Tiêu đề Lớp -->
      <div class="class-title-box">
        <i class="fa-solid fa-graduation-cap"></i>
        <h1 id="class-title">SỔ THU CHI LỚP K60G</h1>
      </div>

      <!-- 2. Bộ lọc Loại & Thời gian -->
      <div class="filter-container">
        <div class="filter-group">
          <label for="select-type"
            ><i class="fa-solid fa-list"></i> Loại:</label
          >
          <select id="select-type">
            <option value="all">Tất cả</option>
            <option value="thu">Khoản Thu (+)</option>
            <option value="chi">Khoản Chi (-)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="select-year"
            ><i class="fa-regular fa-calendar"></i> Năm:</label
          >
          <select id="select-year">
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="select-month"
            ><i class="fa-regular fa-calendar-days"></i> Tháng:</label
          >
          <select id="select-month">
            <option value="1">Tháng 1</option>
            <option value="2">Tháng 2</option>
            <option value="3">Tháng 3</option>
            <option value="4">Tháng 4</option>
            <option value="5">Tháng 5</option>
            <option value="6">Tháng 6</option>
            <option value="7">Tháng 7</option>
            <option value="8">Tháng 8</option>
            <option value="9">Tháng 9</option>
            <option value="10">Tháng 10</option>
            <option value="11">Tháng 11</option>
            <option value="12">Tháng 12</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Khối Bảng Thống Kê Tổng Quan -->
      <div class="summary-container">
        <!-- Thẻ 1: Quỹ Hiện Tại (Toàn thời gian - Cố định ở cả Thu & Chi) -->
        <div class="summary-card balance-card">
          <div class="summary-icon"><i class="fa-solid fa-piggy-bank"></i></div>
          <div class="summary-info">
            <span class="summary-label">Quỹ lớp hiện tại</span>
            <span id="total-balance" class="summary-value">0 VNĐ</span>
          </div>
        </div>

        <!-- Thẻ 2: Tổng Thu/Chi của Tháng đang chọn -->
        <div id="monthly-card" class="summary-card monthly-card thu-mode">
          <div class="summary-icon"><i class="fa-solid fa-chart-line"></i></div>
          <div class="summary-info">
            <span id="monthly-label" class="summary-label"
              >Biến động Tháng 9/2026</span
            >
            <span id="monthly-total" class="summary-value">0 VNĐ</span>
          </div>
        </div>
      </div>

      <!-- Khối thanh tìm kiếm -->
      <div class="search-box-container" id="searchBoxContainer">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm kiếm ID, tên, nội dung, số tiền, ngày (24/09/2026)..."
            autocomplete="off"
          />
          <button id="clearSearchBtn" class="clear-btn" style="display: none">
            ✕
          </button>
        </div>
      </div>

      <!-- Danh sách các ô giao dịch Thu / Chi -->
      <div id="transaction-list" class="transaction-list">
        <!-- Dữ liệu JS sẽ đổ vào đây -->
      </div>
    </main>

    <!-- Script tạo link tải file động chống Cache hoàn toàn -->
    <script>
      const ts = new Date().getTime(); // Mốc thời gian độc nhất

      const dataScript = document.createElement("script");
      dataScript.src = "js/data.js?v=" + ts;

      dataScript.onload = () => {
        const mainScript = document.createElement("script");
        mainScript.src = "js/main.js?v=" + ts;
        document.body.appendChild(mainScript);
      };

      document.body.appendChild(dataScript);
    </script>

    <!-- Pop-up Thông báo Dữ liệu -->
    <div id="noticeModal" class="modal-overlay">
      <div class="modal-card">
        <div class="modal-header">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <h3>Thông Báo Dữ Liệu</h3>
        </div>
        <div class="modal-body">
          <p>
            Trang web này
            <strong>không cập nhật theo thời gian thực (Real-time)</strong>.
          </p>
          <p>
            Dữ liệu thu / chi và các chứng từ biên lai được cập nhật định kỳ khi
            Quản trị viên tải lên hệ thống. Xin cảm ơn!
          </p>
        </div>
        <div class="modal-footer">
          <label class="checkbox-label">
            <input type="checkbox" id="dontShowAgain" />
            <span>Không hiển thị lại thông báo này</span>
          </label>
          <button id="closeNoticeBtn" class="btn-close-modal">
            Tôi đã hiểu
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
